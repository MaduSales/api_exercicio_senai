<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>API de Tempo</title>
</head>
<body class="bg-slate-300 min-h-screen flex items-center justify-center">

    <main class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
        <h1 class="text-xl font-bold text-center mb-6 text-blue-700"> API de Tempo ⛅</h1>
        <div id="searchBox" class="space-y-4">
            <div class="flex flex-col gap-2">
                <label for="searchLocal" class="text-sm font-medium text-slate-600">Digite uma cidade</label>
                 <div class="flex gap-2">
                    <input id="searchLocal" type="search" placeholder="Ex: São Paulo" class="flex-1 border border-slate-300 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="btn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors"> Pesquisar </button>
                </div>
            </div>
            <div id="resultBox" class="hidden mt-8 p-4 bg-neutral-900 rounded-xl border border-blue-100 space-y-2 text-center">
                <h2 id="resultSearch" class="text-lg font-bold text-blue-400"></h2>
                <p id="temperature" class="text-4xl font-black text-gray-50"></p>
                <p id="weather" class="text-md text-gray-400 capitalize italic"></p>
                <p id="humidity" class="text-sm text-gray-50 font-medium"></p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
